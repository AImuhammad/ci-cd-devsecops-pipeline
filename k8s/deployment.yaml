apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-devsecops-app
  labels:
    app: ci-cd-devsecops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-cd-devsecops-app
  template:
    metadata:
      labels:
        app: ci-cd-devsecops-app
    spec:
      containers:
        - name: ci-cd-devsecops-app
          image: muhammad4045/ci-cd-devsecops-app:5.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
